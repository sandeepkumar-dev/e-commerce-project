# ============================================================
# APPLICATION CONFIG
# ============================================================
spring.application.name=api-gateway
server.port=8080

# ============================================================
# EUREKA CLIENT
# ============================================================
eureka.client.service-url.defaultZone=http://admin:admin123@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ============================================================
# ROUTES
# lb://SERVICE-NAME = load balanced via Eureka
# StripPrefix=1 removes the service-name prefix before forwarding
#
# Request  : GET  http://localhost:8080/product-service/api/v1/products
# Forwarded: GET  http://localhost:8081/api/v1/products
# ============================================================

# ── Product Service ────────────────────────────────────────
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/product-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# ── Cart Service ───────────────────────────────────────────
spring.cloud.gateway.routes[1].id=cart-service
spring.cloud.gateway.routes[1].uri=lb://cart-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/cart-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# ── Order Service ──────────────────────────────────────────
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/order-service/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# ── User Service ───────────────────────────────────────────
spring.cloud.gateway.routes[3].id=user-service
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/user-service/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# ── Payment Service ────────────────────────────────────────
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://payment-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/payment-service/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# ── Eureka Dashboard ───────────────────────────────────────
spring.cloud.gateway.routes[5].id=eureka-server
spring.cloud.gateway.routes[5].uri=http://localhost:8761
spring.cloud.gateway.routes[5].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[5].filters[0]=SetPath=/

spring.cloud.gateway.routes[6].id=eureka-static
spring.cloud.gateway.routes[6].uri=http://localhost:8761
spring.cloud.gateway.routes[6].predicates[0]=Path=/eureka/**

# ============================================================
# DISCOVERY LOCATOR
# ============================================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ============================================================
# TIMEOUTS
# ============================================================
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10s

# ============================================================
# CORS
# ============================================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# ============================================================
# LOGGING
# ============================================================
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=WARN
